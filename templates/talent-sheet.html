<div class="faserip-dialog talent-dialog" autocomplete="off">
  <div class="talent-header">
    <img src="{{item.img}}" data-edit="img" width="32" height="32" class="talent-portrait" />
    <input type="text" name="name" value="{{item.name}}" class="talent-name-input" placeholder="Talent Name" />
  </div>

  <div class="talent-body">

    <!-- Category -->
    <fieldset class="talent-fieldset">
      <legend>Category</legend>
      <div class="talent-grid-2col">
        <div class="talent-field">
          <label>Category</label>
          <select name="system.type" class="talent-category-select">
            <option value="">-- Select --</option>
            <option value="Weapon Skill" {{#if (eq system.type "Weapon Skill")}}selected{{/if}}>Weapon Skill</option>
            <option value="Fighting Skill" {{#if (eq system.type "Fighting Skill")}}selected{{/if}}>Fighting Skill</option>
            <option value="Professional Skill" {{#if (eq system.type "Professional Skill")}}selected{{/if}}>Professional Skill</option>
            <option value="Scientific Skill" {{#if (eq system.type "Scientific Skill")}}selected{{/if}}>Scientific Skill</option>
            <option value="Mystic/Mental Skill" {{#if (eq system.type "Mystic/Mental Skill")}}selected{{/if}}>Mystic/Mental Skill</option>
            <option value="Other" {{#if (eq system.type "Other")}}selected{{/if}}>Other</option>
          </select>
        </div>
        <div class="talent-field">
          <label>Specialty</label>
          <select name="system.specialty" class="talent-specialty-select">
            <option value="">-- Select --</option>
          </select>
        </div>
      </div>
    </fieldset>

    <!-- Modifiers -->
    <fieldset class="talent-fieldset">
      <legend>Modifiers</legend>
      <div class="talent-grid-2col">
        <div class="talent-field">
          <label data-tooltip="Column shift applied to the modified ability when making a FEAT roll">Bonus</label>
          <select name="system.bonus" class="talent-bonus-select">
            <option value="+1CS" {{#if (eq system.bonus "+1CS")}}selected{{/if}}>+1CS</option>
            <option value="+2CS" {{#if (eq system.bonus "+2CS")}}selected{{/if}}>+2CS</option>
            <option value="+3CS" {{#if (eq system.bonus "+3CS")}}selected{{/if}}>+3CS</option>
            <option value="Special" {{#if (eq system.bonus "Special")}}selected{{/if}}>Special</option>
          </select>
        </div>
        <div class="talent-field">
          <label>Ability Modified</label>
          <select name="system.abilityModified" class="talent-ability-select">
            <option value="" {{#if (eq system.abilityModified "")}}selected{{/if}}>None</option>
            <option value="fighting" {{#if (eq system.abilityModified "fighting")}}selected{{/if}}>Fighting</option>
            <option value="agility" {{#if (eq system.abilityModified "agility")}}selected{{/if}}>Agility</option>
            <option value="strength" {{#if (eq system.abilityModified "strength")}}selected{{/if}}>Strength</option>
            <option value="endurance" {{#if (eq system.abilityModified "endurance")}}selected{{/if}}>Endurance</option>
            <option value="reason" {{#if (eq system.abilityModified "reason")}}selected{{/if}}>Reason</option>
            <option value="intuition" {{#if (eq system.abilityModified "intuition")}}selected{{/if}}>Intuition</option>
            <option value="psyche" {{#if (eq system.abilityModified "psyche")}}selected{{/if}}>Psyche</option>
          </select>
        </div>
        <div class="talent-field talent-field-full">
          <label data-tooltip="Use a fixed rank instead of applying the bonus as a column shift to the base ability">Rank Override</label>
          <select name="system.rankOverride">
            <option value="" {{#if (eq system.rankOverride "")}}selected{{/if}}>Use Bonus</option>
            <option value="Feeble" {{#if (eq system.rankOverride "Feeble")}}selected{{/if}}>Feeble</option>
            <option value="Poor" {{#if (eq system.rankOverride "Poor")}}selected{{/if}}>Poor</option>
            <option value="Typical" {{#if (eq system.rankOverride "Typical")}}selected{{/if}}>Typical</option>
            <option value="Good" {{#if (eq system.rankOverride "Good")}}selected{{/if}}>Good</option>
            <option value="Excellent" {{#if (eq system.rankOverride "Excellent")}}selected{{/if}}>Excellent</option>
            <option value="Remarkable" {{#if (eq system.rankOverride "Remarkable")}}selected{{/if}}>Remarkable</option>
            <option value="Incredible" {{#if (eq system.rankOverride "Incredible")}}selected{{/if}}>Incredible</option>
            <option value="Amazing" {{#if (eq system.rankOverride "Amazing")}}selected{{/if}}>Amazing</option>
            <option value="Monstrous" {{#if (eq system.rankOverride "Monstrous")}}selected{{/if}}>Monstrous</option>
            <option value="Unearthly" {{#if (eq system.rankOverride "Unearthly")}}selected{{/if}}>Unearthly</option>
            <option value="Shift-X" {{#if (eq system.rankOverride "Shift-X")}}selected{{/if}}>Shift-X</option>
            <option value="Shift-Y" {{#if (eq system.rankOverride "Shift-Y")}}selected{{/if}}>Shift-Y</option>
            <option value="Shift-Z" {{#if (eq system.rankOverride "Shift-Z")}}selected{{/if}}>Shift-Z</option>
          </select>
        </div>
        <div class="talent-check-row">
          <label class="talent-check" data-tooltip="Bonuses from this talent stack with other Fighting Talents (e.g. MA-B + Wrestling = +3CS Grappling)">
            <input type="checkbox" name="system.isCumulative" {{#if system.isCumulative}}checked{{/if}} />
            Cumulative w/ Fighting Talents
          </label>
          <label class="talent-check" data-tooltip="Weapon Talents do not stack with each other. Only the highest bonus applies.">
            <input type="checkbox" name="system.isWeaponTalent" {{#if system.isWeaponTalent}}checked{{/if}} />
            Weapon Talent (no stacking)
          </label>
        </div>
      </div>
    </fieldset>

    <!-- Rule Summary -->
    <fieldset class="talent-fieldset">
      <legend>Rule Summary</legend>
      <div class="talent-rule-summary">
        <!-- Populated by JS from specialty data -->
      </div>
    </fieldset>

    <!-- Applies To (action types) -->
    <fieldset class="talent-fieldset">
      <legend>Applies To</legend>
      <div class="talent-applies-grid">
        <label class="talent-check" data-tooltip="Slugfest / melee blunt attacks (Fighting)">
          <input type="checkbox" class="talent-applies-check" value="blunt-attack" {{#if (includes system.appliesTo "blunt-attack")}}checked{{/if}} /> Blunt
        </label>
        <label class="talent-check" data-tooltip="Edged melee attacks (Fighting)">
          <input type="checkbox" class="talent-applies-check" value="edged-attack" {{#if (includes system.appliesTo "edged-attack")}}checked{{/if}} /> Edged
        </label>
        <label class="talent-check" data-tooltip="Ranged attacks — guns, bows, crossbows (Agility)">
          <input type="checkbox" class="talent-applies-check" value="shooting" {{#if (includes system.appliesTo "shooting")}}checked{{/if}} /> Shooting
        </label>
        <label class="talent-check" data-tooltip="Energy power attacks (Power rank)">
          <input type="checkbox" class="talent-applies-check" value="energy" {{#if (includes system.appliesTo "energy")}}checked{{/if}} /> Energy
        </label>
        <label class="talent-check" data-tooltip="Force power attacks (Power rank)">
          <input type="checkbox" class="talent-applies-check" value="force" {{#if (includes system.appliesTo "force")}}checked{{/if}} /> Force
        </label>
        <label class="talent-check" data-tooltip="Thrown blunt objects/weapons (Agility)">
          <input type="checkbox" class="talent-applies-check" value="throwing-blunt" {{#if (includes system.appliesTo "throwing-blunt")}}checked{{/if}} /> Throw B
        </label>
        <label class="talent-check" data-tooltip="Thrown edged weapons (Agility)">
          <input type="checkbox" class="talent-applies-check" value="throwing-edged" {{#if (includes system.appliesTo "throwing-edged")}}checked{{/if}} /> Throw E
        </label>
        <label class="talent-check" data-tooltip="Grappling attacks (Strength)">
          <input type="checkbox" class="talent-applies-check" value="grappling" {{#if (includes system.appliesTo "grappling")}}checked{{/if}} /> Grappling
        </label>
        <label class="talent-check" data-tooltip="Charging attacks (Endurance)">
          <input type="checkbox" class="talent-applies-check" value="charging" {{#if (includes system.appliesTo "charging")}}checked{{/if}} /> Charging
        </label>
        <label class="talent-check" data-tooltip="Escaping from holds (Strength)">
          <input type="checkbox" class="talent-applies-check" value="escaping" {{#if (includes system.appliesTo "escaping")}}checked{{/if}} /> Escaping
        </label>
        <label class="talent-check" data-tooltip="Dodging/evading attacks (Agility)">
          <input type="checkbox" class="talent-applies-check" value="dodging" {{#if (includes system.appliesTo "dodging")}}checked{{/if}} /> Dodging
        </label>
      </div>
    </fieldset>

    <!-- Special Flags -->
    <fieldset class="talent-fieldset">
      <legend>Special Flags</legend>
      <div class="talent-flags-grid">
        <label class="talent-check" data-tooltip="No range penalties when using this talent (Marksman)">
          <input type="checkbox" class="talent-flag-check" value="no-range-penalty" {{#if (includes system.flags "no-range-penalty")}}checked{{/if}} /> No Range Penalty
        </label>
        <label class="talent-check" data-tooltip="Slam/Stun results ignore comparative Strength/Endurance (MA-A)">
          <input type="checkbox" class="talent-flag-check" value="ignore-str-end" {{#if (includes system.flags "ignore-str-end")}}checked{{/if}} /> Ignore Str/End
        </label>
        <label class="talent-check" data-tooltip="Ignore Body Armor for Stun/Slam effect checks, does not bypass Force Fields (MA-D)">
          <input type="checkbox" class="talent-flag-check" value="ignore-armor-fx" {{#if (includes system.flags "ignore-armor-fx")}}checked{{/if}} /> Ignore Armor (fx)
        </label>
        <label class="talent-check" data-tooltip="No damage needed to trigger Stun/Slam check (MA-D)">
          <input type="checkbox" class="talent-flag-check" value="no-damage-needed" {{#if (includes system.flags "no-damage-needed")}}checked{{/if}} /> No Dmg Needed
        </label>
        <label class="talent-check" data-tooltip="Must study target for 2 rounds before this talent's special effect applies (MA-D)">
          <input type="checkbox" class="talent-flag-check" value="study-required" {{#if (includes system.flags "study-required")}}checked{{/if}} /> Study Required
        </label>
        <label class="talent-check" data-tooltip="+1 to initiative when using this talent (MA-E, Wpn Specialist)">
          <input type="checkbox" class="talent-flag-check" value="initiative" {{#if (includes system.flags "initiative")}}checked{{/if}} /> +1 Initiative
        </label>
      </div>
    </fieldset>

    <!-- Notes -->
    <fieldset class="talent-fieldset">
      <legend>Notes</legend>
      <textarea name="system.notes" rows="3" placeholder="Player notes...">{{system.notes}}</textarea>
    </fieldset>

  </div>
</div>
