<form class="karma-dialog">
    <h2>Karma Adjustment</h2>
    
    <div class="form-group">
      <label>Date:</label>
      <input type="text" name="date" value="{{date}}" />
    </div>
  
    <div class="form-group">
      <label>Event:</label>
      <select name="presetEvent">
        <option value="">--Custom--</option>
        <option value="20">Rescue (+20 Karma)</option>
        <option value="-40">Public Defeat (-40 Karma)</option>
        <option value="50">Major Heroic Act (+50 Karma)</option>
        <option value="-10">Property Damage (-10 Karma)</option>
      </select>
    </div>
  
    <div class="form-group">
      <label>Manual Adjustment:</label>
      <input type="number" name="manualAdjustment" value="0" />
    </div>
  
    <div class="form-group">
      <label>Notes:</label>
      <textarea name="notes"></textarea>
    </div>
  
    <button type="submit"><i class="fa fa-check"></i> Apply Karma</button>
  </form>
