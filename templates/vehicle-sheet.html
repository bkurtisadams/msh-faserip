<form class="faserip-dialog vehicle-dialog vehicle-item-sheet">

  {{!-- ═══ HEADER ═══ --}}
  <div class="veh-item-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" width="48" height="48" title="Click to edit image">
    <input type="text" name="name" value="{{item.name}}" placeholder="Vehicle Name" class="veh-item-name">
  </div>

  <div class="dialog-body sheet-body">

    {{!-- ═══ TYPE / COST / COMPARTMENTED ROW ═══ --}}
    <div class="veh-item-row3">
      <div class="form-group">
        <label>Type</label>
        <select name="system.type">
          {{#each vehicleTypes}}
            <option value="{{this}}" {{#if (eq ../system.type this)}}selected{{/if}}>{{this}}</option>
          {{/each}}
        </select>
      </div>
      <div class="form-group">
        <label>Cost (Resources)</label>
        <select name="system.cost">
          {{#each allRanks}}
            <option value="{{this}}" {{#if (eq ../system.cost this)}}selected{{/if}}>{{this}}</option>
          {{/each}}
        </select>
      </div>
      <label class="veh-item-comp" title="Compartmented — passengers cannot be targeted without destroying Body first">
        <input type="checkbox" name="system.compartmented" {{#if system.compartmented}}checked{{/if}}>
        Compartmented
      </label>
    </div>

    {{!-- ═══ FOUR STATS ═══ --}}
    <fieldset class="veh-item-fieldset">
      <legend>Stats</legend>
      <div class="veh-item-stats">
        <div class="form-group">
          <label>Control</label>
          <select name="system.control">
            {{#each allRanks}}
              <option value="{{this}}" {{#if (eq ../system.control this)}}selected{{/if}}>{{this}}</option>
            {{/each}}
          </select>
        </div>
        <div class="form-group">
          <label>Speed</label>
          <select name="system.speed">
            {{#each allRanks}}
              <option value="{{this}}" {{#if (eq ../system.speed this)}}selected{{/if}}>{{this}}</option>
            {{/each}}
          </select>
        </div>
        <div class="form-group">
          <label>Body</label>
          <select name="system.body">
            {{#each allRanks}}
              <option value="{{this}}" {{#if (eq ../system.body this)}}selected{{/if}}>{{this}}</option>
            {{/each}}
          </select>
        </div>
        <div class="form-group">
          <label>Protection</label>
          <select name="system.protection">
            {{#each allRanks}}
              <option value="{{this}}" {{#if (eq ../system.protection this)}}selected{{/if}}>{{this}}</option>
            {{/each}}
          </select>
        </div>
      </div>
    </fieldset>

    {{!-- ═══ NOTES / DESCRIPTION ═══ --}}
    <fieldset class="veh-item-fieldset">
      <legend>Details</legend>
      <div class="form-group">
        <label>Notes</label>
        <textarea name="system.features" rows="2" placeholder="Includes Machine Gun, 4 missiles, Stun Cannon…">{{system.features}}</textarea>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="system.description" rows="3">{{system.description}}</textarea>
      </div>
    </fieldset>

  </div>

  <div class="dialog-footer">
    <button type="button" class="cancel-button">Cancel</button>
    <button type="button" class="create-vehicle-actor">Create Vehicle Actor</button>
    <button type="submit" class="submit-button">{{#if item.id}}Update{{else}}Create{{/if}} Vehicle</button>
  </div>
</form>
