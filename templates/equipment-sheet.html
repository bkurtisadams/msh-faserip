<form class="{{cssClass}} equipment-sheet" autocomplete="off" submitOnChange>
    <header class="sheet-header">
      <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" />
      <h1><input name="name" type="text" value="{{item.name}}" placeholder="Equipment Name"/></h1>
    </header>
  
    <section class="sheet-body">
            <div class="form-group">
        <label>Category:</label>
        <select name="system.category" class="equipment-category-select">
          <option value="weapon" {{#if (eq system.category "weapon")}}selected{{/if}}>Weapon</option>
          <option value="armor" {{#if (eq system.category "armor")}}selected{{/if}}>Armor</option>
          <option value="power-item" {{#if (eq system.category "power-item")}}selected{{/if}}>Power Item</option>
          <option value="custom" {{#if (eq system.category "custom")}}selected{{/if}}>Custom</option>
          <option value="gear" {{#if (eq system.category "gear")}}selected{{/if}}>Gear</option>
        </select>
      </div>
  
      <div class="form-group">
        <label>Material Strength:</label>
        <select name="system.materialStrength">
          <option value="Shift-0" {{#if (eq system.materialStrength "Shift-0")}}selected{{/if}}>Shift-0</option>
          <option value="Feeble" {{#if (eq system.materialStrength "Feeble")}}selected{{/if}}>Feeble</option>
          <option value="Poor" {{#if (eq system.materialStrength "Poor")}}selected{{/if}}>Poor</option>
          <option value="Typical" {{#if (eq system.materialStrength "Typical")}}selected{{/if}}>Typical</option>
          <option value="Good" {{#if (eq system.materialStrength "Good")}}selected{{/if}}>Good</option>
          <option value="Excellent" {{#if (eq system.materialStrength "Excellent")}}selected{{/if}}>Excellent</option>
          <option value="Remarkable" {{#if (eq system.materialStrength "Remarkable")}}selected{{/if}}>Remarkable</option>
          <option value="Incredible" {{#if (eq system.materialStrength "Incredible")}}selected{{/if}}>Incredible</option>
          <option value="Amazing" {{#if (eq system.materialStrength "Amazing")}}selected{{/if}}>Amazing</option>
          <option value="Monstrous" {{#if (eq system.materialStrength "Monstrous")}}selected{{/if}}>Monstrous</option>
          <option value="Unearthly" {{#if (eq system.materialStrength "Unearthly")}}selected{{/if}}>Unearthly</option>
        </select>
      </div>
  
      <div class="form-group">
        <label>Price (Resource Rank):</label>
        <select name="system.price">
          <option value="Shift-0" {{#if (eq system.price "Shift-0")}}selected{{/if}}>Shift-0</option>
          <option value="Feeble" {{#if (eq system.price "Feeble")}}selected{{/if}}>Feeble</option>
          <option value="Poor" {{#if (eq system.price "Poor")}}selected{{/if}}>Poor</option>
          <option value="Typical" {{#if (eq system.price "Typical")}}selected{{/if}}>Typical</option>
          <option value="Good" {{#if (eq system.price "Good")}}selected{{/if}}>Good</option>
          <option value="Excellent" {{#if (eq system.price "Excellent")}}selected{{/if}}>Excellent</option>
          <option value="Remarkable" {{#if (eq system.price "Remarkable")}}selected{{/if}}>Remarkable</option>
          <option value="Incredible" {{#if (eq system.price "Incredible")}}selected{{/if}}>Incredible</option>
          <option value="Amazing" {{#if (eq system.price "Amazing")}}selected{{/if}}>Amazing</option>
          <option value="Monstrous" {{#if (eq system.price "Monstrous")}}selected{{/if}}>Monstrous</option>
          <option value="Unearthly" {{#if (eq system.price "Unearthly")}}selected{{/if}}>Unearthly</option>
        </select>
      </div>
  
      <!-- Weapon-specific fields -->
      <div class="weapon-fields" {{#unless (eq system.category "weapon")}}style="display: none;"{{/unless}}>
        <div class="form-group">
          <label>Weapon Type:</label>
          <select name="system.weaponType">
            <option value="" {{#if (eq system.weaponType "")}}selected{{/if}}>None</option>
            <option value="shooting" {{#if (eq system.weaponType "shooting")}}selected{{/if}}>Shooting Weapon</option>
            <option value="melee" {{#if (eq system.weaponType "melee")}}selected{{/if}}>Melee Weapon</option>
            <option value="thrown" {{#if (eq system.weaponType "thrown")}}selected{{/if}}>Thrown Weapon</option>
          </select>
        </div>
  
        <div class="form-group">
          <label>Range (in areas):</label>
          <input type="text" name="system.range" value="{{system.range}}" />
        </div>
  
        <div class="form-group">
          <label>Damage:</label>
          <input type="text" name="system.damage" value="{{system.damage}}" />
        </div>
  
        <div class="form-group">
          <label>Damage Type:</label>
          <select name="system.damageType">
            <option value="" {{#if (eq system.damageType "")}}selected{{/if}}>None</option>
            <option value="S" {{#if (eq system.damageType "S")}}selected{{/if}}>Shooting (S)</option>
            <option value="E" {{#if (eq system.damageType "E")}}selected{{/if}}>Energy (E)</option>
            <option value="F" {{#if (eq system.damageType "F")}}selected{{/if}}>Force (F)</option>
            <option value="EA" {{#if (eq system.damageType "EA")}}selected{{/if}}>Edged Attack (EA)</option>
            <option value="BA" {{#if (eq system.damageType "BA")}}selected{{/if}}>Blunt Attack (BA)</option>
            <option value="TE" {{#if (eq system.damageType "TE")}}selected{{/if}}>Throwing Edged (TE)</option>
            <option value="TB" {{#if (eq system.damageType "TB")}}selected{{/if}}>Throwing Blunt (TB)</option>
            <option value="GP" {{#if (eq system.damageType "GP")}}selected{{/if}}>Grappling (GP)</option>
            <option value="Gb" {{#if (eq system.damageType "Gb")}}selected{{/if}}>Grabbing (Gb)</option>
            <option value="Stun" {{#if (eq system.damageType "Stun")}}selected{{/if}}>Stunning (Stun)</option>
          </select>
        </div>
  
        <div class="form-row">
          <div class="form-group half">
            <label>Rate of Fire:</label>
            <input type="text" name="system.rate" value="{{system.rate}}" />
          </div>
          <div class="form-group half">
            <label>Shots Before Reload:</label>
            <input type="text" name="system.shots" value="{{system.shots}}" />
          </div>
        </div>
  
        <div class="form-group">
          <label>Ammunition Type:</label>
          <select name="system.ammoType">
            <option value="Standard" {{#if (eq system.ammoType "Standard")}}selected{{/if}}>Standard</option>
            <option value="Mercy" {{#if (eq system.ammoType "Mercy")}}selected{{/if}}>Mercy Shot</option>
            <option value="AP" {{#if (eq system.ammoType "AP")}}selected{{/if}}>Armor Piercing (AP)</option>
            <option value="Rubber" {{#if (eq system.ammoType "Rubber")}}selected{{/if}}>Rubber Shot</option>
            <option value="Explosive" {{#if (eq system.ammoType "Explosive")}}selected{{/if}}>Explosive Shot</option>
            <option value="Canister" {{#if (eq system.ammoType "Canister")}}selected{{/if}}>Canister Shot</option>
            <option value="Heat-Seeker" {{#if (eq system.ammoType "Heat-Seeker")}}selected{{/if}}>Heat-Seeker</option>
            <option value="Power Pack" {{#if (eq system.ammoType "Power Pack")}}selected{{/if}}>Power Pack</option>
          </select>
        </div>

        <div class="form-group">
          <label>Legality:</label>
          <select name="system.legality">
            <option value="legal" {{#if (eq system.legality "legal")}}selected{{/if}}>Legal</option>
            <option value="restricted" {{#if (eq system.legality "restricted")}}selected{{/if}}>Restricted</option>
            <option value="military" {{#if (eq system.legality "military")}}selected{{/if}}>Military Only</option>
            <option value="illegal" {{#if (eq system.legality "illegal")}}selected{{/if}}>Illegal</option>
          </select>
        </div>
        
        <div class="form-row">
          <div class="form-group half">
            <label>Burst/Scatter:</label>
            <select name="system.burstScatter">
              <option value="none" {{#if (eq system.burstScatter "none")}}selected{{/if}}>None</option>
              <option value="burst" {{#if (eq system.burstScatter "burst")}}selected{{/if}}>Burst</option>
              <option value="scatter" {{#if (eq system.burstScatter "scatter")}}selected{{/if}}>Scatter</option>
            </select>
          </div>
          <div class="form-group half">
            <label>Requires Two Operators:</label>
            <input type="checkbox" name="system.requiresTwoOperators" {{checked system.requiresTwoOperators}}/>
          </div>
        </div>
        
        <div class="form-group">
          <label>Stun/Gas Intensity:</label>
          <select name="system.stunIntensity">
            <option value="" {{#if (eq system.stunIntensity "")}}selected{{/if}}>None</option>
            <option value="Shift-0" {{#if (eq system.stunIntensity "Shift-0")}}selected{{/if}}>Shift-0</option>
            <option value="Feeble" {{#if (eq system.stunIntensity "Feeble")}}selected{{/if}}>Feeble</option>
            <option value="Poor" {{#if (eq system.stunIntensity "Poor")}}selected{{/if}}>Poor</option>
            <option value="Typical" {{#if (eq system.stunIntensity "Typical")}}selected{{/if}}>Typical</option>
            <option value="Good" {{#if (eq system.stunIntensity "Good")}}selected{{/if}}>Good</option>
            <option value="Excellent" {{#if (eq system.stunIntensity "Excellent")}}selected{{/if}}>Excellent</option>
            <option value="Remarkable" {{#if (eq system.stunIntensity "Remarkable")}}selected{{/if}}>Remarkable</option>
            <option value="Incredible" {{#if (eq system.stunIntensity "Incredible")}}selected{{/if}}>Incredible</option>
            <option value="Amazing" {{#if (eq system.stunIntensity "Amazing")}}selected{{/if}}>Amazing</option>
            <option value="Monstrous" {{#if (eq system.stunIntensity "Monstrous")}}selected{{/if}}>Monstrous</option>
            <option value="Unearthly" {{#if (eq system.stunIntensity "Unearthly")}}selected{{/if}}>Unearthly</option>
            <option value="Shift-X" {{#if (eq system.stunIntensity "Shift-X")}}selected{{/if}}>Shift-X</option>
            <option value="Class 1000" {{#if (eq system.stunIntensity "Class 1000")}}selected{{/if}}>Class 1000</option>
            <option value="Class 3000" {{#if (eq system.stunIntensity "Class 3000")}}selected{{/if}}>Class 3000</option>
            <option value="Class 5000" {{#if (eq system.stunIntensity "Class 5000")}}selected{{/if}}>Class 5000</option>
          </select>
        </div>
        
        <div class="form-row">
          <div class="form-group half">
            <label>Continuing Damage:</label>
            <input type="text" name="system.continuingDamage" value="{{system.continuingDamage}}" />
          </div>
          <div class="form-group half">
            <label>Duration:</label>
            <input type="text" name="system.continuingDamageRounds" value="{{system.continuingDamageRounds}}" placeholder="e.g., 5 or 1d10" />
          </div>
        </div>

        <!-- Grenade Fields -->
        <div class="specialized-section">
          <div class="section-header collapsible" data-section="grenade-fields">
            <h3>Grenade Properties</h3>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="grenade-fields section-content" style="display: none;">
            <div class="form-group">
              <label>Grenade Type:</label>
              <select name="system.grenadeType">
                <option value="" {{#if (eq system.grenadeType "")}}selected{{/if}}>None</option>
                <option value="fragmentation" {{#if (eq system.grenadeType "fragmentation")}}selected{{/if}}>Fragmentation</option>
                <option value="smoke" {{#if (eq system.grenadeType "smoke")}}selected{{/if}}>Smoke</option>
                <option value="tearGas" {{#if (eq system.grenadeType "tearGas")}}selected{{/if}}>Tear Gas</option>
                <option value="knockout" {{#if (eq system.grenadeType "knockout")}}selected{{/if}}>Knock-Out</option>
                <option value="flash" {{#if (eq system.grenadeType "flash")}}selected{{/if}}>Flash</option>
                <option value="concussive" {{#if (eq system.grenadeType "concussive")}}selected{{/if}}>Concussive</option>
                <option value="sonic" {{#if (eq system.grenadeType "sonic")}}selected{{/if}}>Sonic</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Blast Radius (areas):</label>
              <input type="number" name="system.grenadeRadius" value="{{system.grenadeRadius}}" min="0" step="1"/>
            </div>

            <div class="form-group">
              <label>Gas/Stun Intensity:</label>
              <select name="system.grenadeIntensity">
                <option value="" {{#if (eq system.grenadeIntensity "")}}selected{{/if}}>None</option>
                <option value="Feeble" {{#if (eq system.grenadeIntensity "Feeble")}}selected{{/if}}>Feeble</option>
                <option value="Poor" {{#if (eq system.grenadeIntensity "Poor")}}selected{{/if}}>Poor</option>
                <option value="Typical" {{#if (eq system.grenadeIntensity "Typical")}}selected{{/if}}>Typical</option>
                <option value="Good" {{#if (eq system.grenadeIntensity "Good")}}selected{{/if}}>Good</option>
                <option value="Excellent" {{#if (eq system.grenadeIntensity "Excellent")}}selected{{/if}}>Excellent</option>
                <option value="Remarkable" {{#if (eq system.grenadeIntensity "Remarkable")}}selected{{/if}}>Remarkable</option>
                <option value="Incredible" {{#if (eq system.grenadeIntensity "Incredible")}}selected{{/if}}>Incredible</option>
                <option value="Amazing" {{#if (eq system.grenadeIntensity "Amazing")}}selected{{/if}}>Amazing</option>
                <option value="Monstrous" {{#if (eq system.grenadeIntensity "Monstrous")}}selected{{/if}}>Monstrous</option>
                <option value="Unearthly" {{#if (eq system.grenadeIntensity "Unearthly")}}selected{{/if}}>Unearthly</option>
              </select>
            </div>

            <div class="form-group">
              <label>Damage:</label>
              <input type="text" name="system.grenadeDamage" value="{{system.grenadeDamage}}" />
            </div>
            
            <div class="form-group">
              <label>Damage Type:</label>
              <select name="system.grenadeDamageType">
                <option value="" {{#if (eq system.grenadeDamageType "")}}selected{{/if}}>None</option>
                <option value="S" {{#if (eq system.grenadeDamageType "S")}}selected{{/if}}>Shooting (S)</option>
                <option value="E" {{#if (eq system.grenadeDamageType "E")}}selected{{/if}}>Energy (E)</option>
                <option value="F" {{#if (eq system.grenadeDamageType "F")}}selected{{/if}}>Force (F)</option>
                <option value="EA" {{#if (eq system.grenadeDamageType "EA")}}selected{{/if}}>Edged Attack (EA)</option>
                <option value="BA" {{#if (eq system.grenadeDamageType "BA")}}selected{{/if}}>Blunt Attack (BA)</option>
                <option value="TE" {{#if (eq system.damageType "TE")}}selected{{/if}}>Throwing Edged (TE)</option>
                <option value="TB" {{#if (eq system.damageType "TB")}}selected{{/if}}>Throwing Blunt (TB)</option>

              </select>
            </div>

          </div>
        </div>

        <!-- Missile Fields -->
        <div class="specialized-section">
          <div class="section-header collapsible" data-section="missile-fields">
            <h3>Missile Properties</h3>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="missile-fields section-content" style="display: none;">
            <div class="form-group">
              <label>Missile Type:</label>
              <select name="system.missileType">
                <option value="" {{#if (eq system.missileType "")}}selected{{/if}}>None</option>
                <option value="standard" {{#if (eq system.missileType "standard")}}selected{{/if}}>Standard</option>
                <option value="high-tech" {{#if (eq system.missileType "high-tech")}}selected{{/if}}>High-Tech</option>
                <option value="high-speed" {{#if (eq system.missileType "high-speed")}}selected{{/if}}>High-Speed</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Guidance System:</label>
              <select name="system.guidanceSystem">
                <option value="" {{#if (eq system.guidanceSystem "")}}selected{{/if}}>None</option>
                <option value="wire-guided" {{#if (eq system.guidanceSystem "wire-guided")}}selected{{/if}}>Wire-Guided</option>
                <option value="tele-guided" {{#if (eq system.guidanceSystem "tele-guided")}}selected{{/if}}>Tele-Guided</option>
                <option value="computer" {{#if (eq system.guidanceSystem "computer")}}selected{{/if}}>Computer-Guided</option>
                <option value="radio" {{#if (eq system.guidanceSystem "radio")}}selected{{/if}}>Radio-Linked</option>
                <option value="heat-seeking" {{#if (eq system.guidanceSystem "heat-seeking")}}selected{{/if}}>Heat-Seeking</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Payload Type:</label>
              <select name="system.payloadType">
                <option value="" {{#if (eq system.payloadType "")}}selected{{/if}}>None</option>
                <option value="standard" {{#if (eq system.payloadType "standard")}}selected{{/if}}>Standard</option>
                <option value="concentrated" {{#if (eq system.payloadType "concentrated")}}selected{{/if}}>Concentrated Explosive</option>
                <option value="high-explosive" {{#if (eq system.payloadType "high-explosive")}}selected{{/if}}>High Explosive</option>
                <option value="incendiary" {{#if (eq system.payloadType "incendiary")}}selected{{/if}}>Incendiary</option>
                <option value="gas" {{#if (eq system.payloadType "gas")}}selected{{/if}}>Gas</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Body/Structure Rank:</label>
              <select name="system.missileBody">
                <option value="" {{#if (eq system.missileBody "")}}selected{{/if}}>None</option>
                <option value="Typical" {{#if (eq system.missileBody "Typical")}}selected{{/if}}>Typical</option>
                <option value="Good" {{#if (eq system.missileBody "Good")}}selected{{/if}}>Good</option>
                <option value="Excellent" {{#if (eq system.missileBody "Excellent")}}selected{{/if}}>Excellent</option>
                <option value="Remarkable" {{#if (eq system.missileBody "Remarkable")}}selected{{/if}}>Remarkable</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Control Rank:</label>
              <select name="system.missileControl">
                <option value="" {{#if (eq system.missileControl "")}}selected{{/if}}>None</option>
                <option value="Poor" {{#if (eq system.missileControl "Poor")}}selected{{/if}}>Poor</option>
                <option value="Remarkable" {{#if (eq system.missileControl "Remarkable")}}selected{{/if}}>Remarkable</option>
                <option value="Incredible" {{#if (eq system.missileControl "Incredible")}}selected{{/if}}>Incredible</option>
              </select>
            </div>
            
            <div class="form-group">
              <label>Speed Rank:</label>
              <select name="system.missileSpeed">
                <option value="" {{#if (eq system.missileSpeed "")}}selected{{/if}}>None</option>
                <option value="Excellent" {{#if (eq system.missileSpeed "Excellent")}}selected{{/if}}>Excellent</option>
                <option value="Amazing" {{#if (eq system.missileSpeed "Amazing")}}selected{{/if}}>Amazing</option>
              </select>
            </div>

            <div class="form-group">
              <label>Primary Damage:</label>
              <input type="text" name="system.missileDamage" value="{{system.missileDamage}}" />
            </div>
            
            <div class="form-group">
              <label>Secondary Damage:</label>
              <input type="text" name="system.missileSecondaryDamage" value="{{system.missileSecondaryDamage}}" />
              <p class="hint">Damage to adjacent areas (if applicable)</p>
            </div>
            
            <div class="form-group">
              <label>Damage Type:</label>
              <select name="system.missileDamageType">
                <option value="" {{#if (eq system.missileDamageType "")}}selected{{/if}}>None</option>
                <option value="S" {{#if (eq system.missileDamageType "S")}}selected{{/if}}>Shooting (S)</option>
                <option value="E" {{#if (eq system.missileDamageType "E")}}selected{{/if}}>Energy (E)</option>
                <option value="F" {{#if (eq system.missileDamageType "F")}}selected{{/if}}>Force (F)</option>
                <option value="EA" {{#if (eq system.missileDamageType "EA")}}selected{{/if}}>Edged Attack (EA)</option>
                <option value="BA" {{#if (eq system.missileDamageType "BA")}}selected{{/if}}>Blunt Attack (BA)</option>
                <option value="TE" {{#if (eq system.damageType "TE")}}selected{{/if}}>Throwing Edged (TE)</option>
                <option value="TB" {{#if (eq system.damageType "TB")}}selected{{/if}}>Throwing Blunt (TB)</option>

              </select>
            </div>
            
          </div>
        </div>

        <!-- Special Ammunition -->
        <div class="specialized-section">
          <div class="section-header collapsible" data-section="ammo-fields">
            <h3>Special Ammunition</h3>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="ammo-fields section-content" style="display: none;">
            <div class="form-group">
              <label>Available Ammunition Types:</label>
              <div class="ammo-types-grid">
                <div class="ammo-type-item">
                  <input type="checkbox" name="system.specialAmmo.mercy" {{checked system.specialAmmo.mercy}}/>
                  <label>Mercy Shot</label>
                </div>
                <div class="ammo-type-item">
                  <input type="checkbox" name="system.specialAmmo.ap" {{checked system.specialAmmo.ap}}/>
                  <label>Armor Piercing</label>
                </div>
                <div class="ammo-type-item">
                  <input type="checkbox" name="system.specialAmmo.rubber" {{checked system.specialAmmo.rubber}}/>
                  <label>Rubber Shot</label>
                </div>
                <div class="ammo-type-item">
                  <input type="checkbox" name="system.specialAmmo.explosive" {{checked system.specialAmmo.explosive}}/>
                  <label>Explosive Shot</label>
                </div>
                <div class="ammo-type-item">
                  <input type="checkbox" name="system.specialAmmo.canister" {{checked system.specialAmmo.canister}}/>
                  <label>Canister Shot</label>
                </div>
                <div class="ammo-type-item">
                  <input type="checkbox" name="system.specialAmmo.heatSeeker" {{checked system.specialAmmo.heatSeeker}}/>
                  <label>Heat-Seeker</label>
                </div>
              </div>
            </div>
          </div>
        </div>
  
      <!-- Armor-specific fields -->
      <div class="armor-fields" {{#unless (eq system.category "armor")}}style="display: none;"{{/unless}}>
        <div class="form-group">
          <label>Protection Value:</label>
          <input type="text" name="system.protection" value="{{system.protection}}" />
        </div>
  
        <div class="form-group">
          <label>Coverage:</label>
          <select name="system.coverage">
            <option value="partial" {{#if (eq system.coverage "partial")}}selected{{/if}}>Partial</option>
            <option value="full" {{#if (eq system.coverage "full")}}selected{{/if}}>Full</option>
          </select>
        </div>
      </div>
  
      <div class="form-group">
        <label>Notes:</label>
        <textarea name="system.notes" rows="3">{{system.notes}}</textarea>
      </div>
  
      <div class="form-group">
        <label>Description:</label>
        <textarea name="system.description" rows="5">{{system.description}}</textarea>
      </div>
    </section>

    <!-- Add this to your equipment-sheet.html -->
    <!-- Power item section in equipment-sheet.html -->
    <div class="power-item-fields" {{#unless (eq system.category "power-item")}}style="display: none;"{{/unless}}>
        <div class="form-group">
          <label>Power Rank:</label>
          <select name="system.powerRank">
            <option value="Shift-0" {{#if (eq system.powerRank "Shift-0")}}selected{{/if}}>Shift-0</option>
            <option value="Feeble" {{#if (eq system.powerRank "Feeble")}}selected{{/if}}>Feeble</option>
            <option value="Poor" {{#if (eq system.powerRank "Poor")}}selected{{/if}}>Poor</option>
            <option value="Typical" {{#if (eq system.powerRank "Typical")}}selected{{/if}}>Typical</option>
            <option value="Good" {{#if (eq system.powerRank "Good")}}selected{{/if}}>Good</option>
            <option value="Excellent" {{#if (eq system.powerRank "Excellent")}}selected{{/if}}>Excellent</option>
            <option value="Remarkable" {{#if (eq system.powerRank "Remarkable")}}selected{{/if}}>Remarkable</option>
            <option value="Incredible" {{#if (eq system.powerRank "Incredible")}}selected{{/if}}>Incredible</option>
            <option value="Amazing" {{#if (eq system.powerRank "Amazing")}}selected{{/if}}>Amazing</option>
            <option value="Monstrous" {{#if (eq system.powerRank "Monstrous")}}selected{{/if}}>Monstrous</option>
            <option value="Unearthly" {{#if (eq system.powerRank "Unearthly")}}selected{{/if}}>Unearthly</option>
          </select>
        </div>
        
        <!-- Rest of power-item fields -->
    </div>
    
    <div class="form-group">
      <label>Linked Ability:</label>
      <select name="system.linkedAbility">
        <option value="fighting" {{#if (eq system.linkedAbility "fighting")}}selected{{/if}}>Fighting</option>
        <option value="agility" {{#if (eq system.linkedAbility "agility")}}selected{{/if}}>Agility</option>
        <option value="strength" {{#if (eq system.linkedAbility "strength")}}selected{{/if}}>Strength</option>
        <option value="endurance" {{#if (eq system.linkedAbility "endurance")}}selected{{/if}}>Endurance</option>
        <option value="reason" {{#if (eq system.linkedAbility "reason")}}selected{{/if}}>Reason</option>
        <option value="intuition" {{#if (eq system.linkedAbility "intuition")}}selected{{/if}}>Intuition</option>
        <option value="psyche" {{#if (eq system.linkedAbility "psyche")}}selected{{/if}}>Psyche</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Power Type:</label>
      <select name="system.powerType">
        <option value="energy" {{#if (eq system.powerType "energy")}}selected{{/if}}>Energy</option>
        <option value="force" {{#if (eq system.powerType "force")}}selected{{/if}}>Force</option>
        <option value="matter" {{#if (eq system.powerType "matter")}}selected{{/if}}>Matter Control</option>
        <option value="mental" {{#if (eq system.powerType "mental")}}selected{{/if}}>Mental</option>
        <option value="magical" {{#if (eq system.powerType "magical")}}selected{{/if}}>Magical</option>
        <option value="self" {{#if (eq system.powerType "self")}}selected{{/if}}>Self-Alteration</option>
        <option value="sensory" {{#if (eq system.powerType "sensory")}}selected{{/if}}>Sensory</option>
        <option value="travel" {{#if (eq system.powerType "travel")}}selected{{/if}}>Travel</option>
        <option value="custom" {{#if (eq system.powerType "custom")}}selected{{/if}}>Custom</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>Range:</label>
      <input type="text" name="system.powerRange" value="{{system.powerRange}}" />
    </div>
  </div>
  
  <!-- Custom equipment fields -->
  <div class="custom-fields" {{#unless (eq system.category "custom")}}style="display: none;"{{/unless}}>
    <div class="form-group">
      <label>Custom Abilities:</label>
      <button type="button" class="add-custom-ability">+ Add Ability</button>
    </div>
    
    <div class="custom-abilities-list">
      {{#each system.customAbilities as |ability i|}}
      <div class="custom-ability">
        <div class="ability-header">
          <input type="text" name="system.customAbilities.{{i}}.name" value="{{ability.name}}" placeholder="Ability Name"/>
          <button type="button" class="remove-custom-ability" data-index="{{i}}"><i class="fas fa-trash"></i></button>
        </div>
        <div class="ability-details">
          <div class="form-row">
            <div class="form-group half">
              <label>Rank:</label>
              <select name="system.customAbilities.{{i}}.rank">
                {{#each ../ranks}}
                <option value="{{this}}" {{#if (eq ../ability.rank this)}}selected{{/if}}>{{this}}</option>
                {{/each}}
              </select>
            </div>
            <div class="form-group half">
              <label>Damage Type:</label>
              <select name="system.customAbilities.{{i}}.damageType">
                <option value="" {{#if (eq ability.damageType "")}}selected{{/if}}>None</option>
                {{#each ../damageTypes}}
                <option value="{{this}}" {{#if (eq ../ability.damageType this)}}selected{{/if}}>{{this}}</option>
                {{/each}}
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Range:</label>
            <input type="text" name="system.customAbilities.{{i}}.range" value="{{ability.range}}" />
          </div>
          <div class="form-group">
            <label>Description:</label>
            <textarea name="system.customAbilities.{{i}}.description">{{ability.description}}</textarea>
          </div>
        </div>
      </div>
      {{/each}}
    </div>
  </div>

  </form>
