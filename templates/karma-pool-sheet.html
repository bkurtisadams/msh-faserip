<form class="karma-pool-sheet" autocomplete="off">
  <h2>Team Karma Pool</h2>
  
  <div class="karma-summary">
    <div class="summary-item">
      <label>{{actorName}}'s<br>Available Karma</label>
      <div class="value">{{currentKarma}}</div>
    </div>
    <div class="summary-item karma-pool-summary">
      <label>Team<br>Karma Pool</label>
      <div class="value">{{teamKarmaPool}}</div>
    </div>
  </div>
  
  <section class="karma-pool-section">
    <div class="pool-buttons">
      <button type="button" class="contribute-to-pool"><i class="fas fa-plus"></i> Contribute Karma</button>
      <button type="button" class="use-from-pool"><i class="fas fa-hand-sparkles"></i> Use Pool Karma</button>
      <button type="button" class="delete-pool danger-button"><i class="fas fa-trash"></i> Delete Pool & Refund</button>
    </div>
    
    <div class="pool-members">
      <h4>Team Members <button type="button" class="add-to-pool" style="float: right;"><i class="fas fa-user-plus"></i> Add Member</button></h4>
      
      <table class="members-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Available Karma</th>
            <th>Contributed (Lifetime)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {{#each poolMembers as |member|}}
          <tr>
            <td>{{member.name}}</td>
            <td>{{member.karma}}</td>
            <td>{{member.poolContribution}}</td>
            <td>
              <a class="remove-from-pool" data-id="{{member.id}}" title="Remove from team">
                <i class="fas fa-user-minus"></i>
              </a>
            </td>
          </tr>
          {{else}}
          <tr>
            <td colspan="4" style="text-align: center; color: #999; font-style: italic;">
              No team members yet. Add heroes to the team pool.
            </td>
          </tr>
          {{/each}}
        </tbody>
      </table>
    </div>
  </section>
</form>
